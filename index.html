<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manny Ludo King</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh}.board{width:94vw;max-width:400px;aspect-ratio:1;background:#fff;border-radius:16px;position:relative;overflow:hidden;border:4px solid #000;margin-top:10px}.token{position:absolute;width:8%;aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 8px #000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;transition:.3s;z-index:10}.red{background:#ef4444}.green{background:#22c55e}.yellow{background:#eab308;color:#000}.blue{background:#3b82f6}.dice{width:70px;height:70px;background:#fff;color:#111;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;margin:10px auto}.controls{width:94vw;max-width:400px;background:#1e293b;border-radius:18px;padding:12px;margin-top:10px;text-align:center}.btn{padding:12px 22px;border-radius:22px;border:0;font-weight:900;background:#ffcc00;color:#111;margin:5px}</style></head><body>
<h2 style="color:#ffcc00;margin:10px">🎲 MANNY LUDO KING</h2>
<div class="board" id="board"></div>
<div class="controls"><div id="dice" class="dice">🎲</div><div id="turn" style="font-weight:900">RED TURN</div><button class="btn" onclick="roll()">ROLL DICE</button><button class="btn" style="background:#334155;color:#fff" onclick="reset()">NEW GAME</button><p style="font-size:11px;opacity:.6">Need 6 to start • Tap token to move • Captures opponent!</p></div>
<script>
const TRACK=[[8,43],[15,43],[22,43],[29,43],[36,43],[41,43],[41,36],[41,29],[41,22],[41,15],[41,8],[47,8],[53,8],[53,15],[53,22],[53,29],[53,36],[53,43],[60,43],[67,43],[74,43],[81,43],[88,43],[94,43],[94,50],[94,57],[88,57],[81,57],[74,57],[67,57],[60,57],[53,57],[53,64],[53,71],[53,78],[53,85],[53,92],[47,92],[41,92],[41,85],[41,78],[41,71],[41,64],[41,57],[34,57],[27,57],[20,57],[13,57],[6,57],[6,50]];
const HOME={red:[[15,15],[32,15],[15,32],[32,32]],green:[[68,15],[85,15],[68,32],[85,32]],yellow:[[68,68],[85,68],[68,85],[85,85]],blue:[[15,68],[32,68],[15,85],[32,85]]};
const HOME_STRETCH={red:[[41,50],[34,50],[27,50],[20,50],[13,50],[6,50]],green:[[47,14],[47,21],[47,28],[47,35],[47,42],[47,48]],yellow:[[53,50],[60,50],[67,50],[74,50],[81,50],[88,50]],blue:[[47,86],[47,79],[47,72],[47,65],[47,58],[47,52]]};
let players=['red','green','yellow','blue'].map((c,i)=>({color:c,start:[0,13,26,39][i],tokens:[{p:-1},{p:-1},{p:-1},{p:-1}]}));
let turn=0,dice=0,can=false;
const board=document.getElementById('board');
function tone(f){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.3,a.currentTime);g.gain.exponentialRampToValueAtTime(.01,a.currentTime+.3);o.start();o.stop(a.currentTime+.3)}catch(e){}}
function draw(){document.querySelectorAll('.token').forEach(e=>e.remove());players.forEach((pl,pi)=>{pl.tokens.forEach((t,ti)=>{let el=document.createElement('div');el.className='token '+pl.color;el.textContent=ti+1;let x,y;if(t.p===-1){[x,y]=HOME[pl.color][ti]}else if(t.p>=100){let s=t.p-100;if(s>=6)return;let pr=HOME_STRETCH[pl.color][s];x=pr[0];y=pr[1]}else if(t.p>=200)return;else{let idx=(pl.start+t.p)%52;[x,y]=TRACK[idx]}el.style.left=x+'%';el.style.top=y+'%';el.style.transform='translate(-50%,-50%)';if(pi===turn&&can)el.style.boxShadow='0 0 0 4px #ffcc00';el.onclick=()=>move(pi,ti);board.appendChild(el)})});}
function roll(){document.getElementById('dice').textContent='...';setTimeout(()=>{dice=Math.floor(Math.random()*6)+1;document.getElementById('dice').textContent=dice;tone(400);let pl=players[turn];can=pl.tokens.some(t=>t.p===-1?dice===6:t.p<105);if(!can){document.getElementById('turn').textContent='No move! Next...';setTimeout(next,800)}else{document.getElementById('turn').textContent=pl.color.toUpperCase()+' - Tap token!'}draw()},400)}
function move(pi,ti){if(pi!==turn||!can)return;let t=players[pi].tokens[ti];if(t.p===-1){if(dice!==6)return;t.p=0}else if(t.p>=100){if(t.p+dice>105)return;t.p+=dice;if(t.p===105){t.p=200;tone(900);alert(pl.color.toUpperCase()+' HOME!')}}else{t.p+=dice;if(t.p>51){let ex=t.p-52;if(ex>5){t.p-=dice;return}t.p=100+ex}else{let my=(players[pi].start+t.p)%52;players.forEach((opl,oi)=>{if(oi===pi)return;opl.tokens.forEach(ot=>{if(ot.p>=0&&ot.p<100){let oi2=(opl.start+ot.p)%52;if(oi2===my){ot.p=-1;tone(150)}}})})}}can=false;draw();if(t.p===200||true){if(players[turn].tokens.filter(x=>x.p===200).length===4){alert('🏆 '+players[turn].color.toUpperCase()+' WINS!');reset();return}}if(dice!==6)next();else{document.getElementById('dice').textContent='🎲';document.getElementById('turn').textContent=players[turn].color.toUpperCase()+' got 6! Roll again'}}
function next(){turn=(turn+1)%4;document.getElementById('turn').textContent=players[turn].color.toUpperCase()+' TURN';document.getElementById('dice').textContent='🎲';draw()}
function reset(){players.forEach(p=>p.tokens.forEach(t=>t.p=-1));turn=0;draw();document.getElementById('turn').textContent='RED TURN'}
board.style.background=`repeating-linear-gradient(0deg,#fff,#fff 6.6%,#ddd 6.6%,#ddd 6.7%),repeating-linear-gradient(90deg,#fff,#fff 6.6%,#ddd 6.6%,#ddd 6.7%)`;reset();
</script></body></html>
